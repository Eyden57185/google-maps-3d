<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps 3D - Édition Ultime Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', Roboto, sans-serif; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .dark .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .ui-overlay { z-index: 1000; pointer-events: none; }
        .interactive { pointer-events: auto; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 0.2; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .marker-pulse { animation: pulse-ring 2s infinite cubic-bezier(0.4, 0, 0.6, 1); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 transition-colors duration-500">

    <!-- Barre de recherche supérieure -->
    <div class="absolute top-4 left-4 right-4 md:left-4 md:w-[460px] ui-overlay flex flex-col gap-2.5">
        <div class="interactive glass shadow-2xl rounded-2xl flex items-center px-4 py-3.5 border border-white/20 dark:border-slate-700/50 relative transition-all duration-300 hover:shadow-blue-500/10">
            <svg class="w-5 h-5 text-blue-500 mr-3 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="search-input" placeholder="Explorer villes ou monuments (Tour Eiffel, Tokyo...)" oninput="handleSearchInput(this.value)" class="w-full bg-transparent outline-none text-slate-900 dark:text-slate-100 text-sm font-semibold placeholder-slate-400">
            <button onclick="searchLocation()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-lg shadow-blue-500/30 transition-all cursor-pointer whitespace-nowrap ml-2">Rechercher</button>
            
            <div id="suggestions-box" class="absolute top-16 left-0 right-0 glass shadow-2xl rounded-2xl border border-white/20 dark:border-slate-700 hidden max-h-72 overflow-y-auto z-50"></div>
        </div>

        <!-- Boutons de catégories rapides -->
        <div class="interactive flex gap-2 overflow-x-auto pb-1 scrollbar-none">
            <button onclick="openCategoryList('restaurants')" class="glass hover:bg-blue-600 hover:text-white shadow-md px-4 py-2.5 rounded-xl text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2 border border-white/20 dark:border-slate-700 whitespace-nowrap cursor-pointer transition-all">🍔 Restaurants</button>
            <button onclick="openCategoryList('hotels')" class="glass hover:bg-blue-600 hover:text-white shadow-md px-4 py-2.5 rounded-xl text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2 border border-white/20 dark:border-slate-700 whitespace-nowrap cursor-pointer transition-all">🏨 Hôtels</button>
            <button onclick="openCategoryList('attractions')" class="glass hover:bg-blue-600 hover:text-white shadow-md px-4 py-2.5 rounded-xl text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2 border border-white/20 dark:border-slate-700 whitespace-nowrap cursor-pointer transition-all">🏛️ Activités</button>
            <button onclick="openCategoryList('gas')" class="glass hover:bg-blue-600 hover:text-white shadow-md px-4 py-2.5 rounded-xl text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2 border border-white/20 dark:border-slate-700 whitespace-nowrap cursor-pointer transition-all">⛽ Essence</button>
        </div>
    </div>

    <!-- Panneau latéral des listes -->
    <div id="sidebar-list" class="absolute top-32 left-4 w-96 max-h-[calc(100vh-140px)] glass shadow-2xl rounded-3xl z-20 hidden flex-col border border-white/20 dark:border-slate-700 overflow-hidden backdrop-blur-2xl">
        <div class="p-4 bg-slate-200/50 dark:bg-slate-800/50 border-b border-slate-300 dark:border-slate-700 flex justify-between items-center">
            <h3 id="sidebar-title" class="font-extrabold text-slate-900 dark:text-white text-sm tracking-wide">Liste</h3>
            <button onclick="closeSidebar()" class="w-8 h-8 rounded-full bg-slate-300 dark:bg-slate-700 flex items-center justify-center text-slate-800 dark:text-slate-200 font-bold hover:bg-red-500 hover:text-white transition cursor-pointer">&times;</button>
        </div>
        <div id="sidebar-items" class="overflow-y-auto p-4 space-y-3 flex-1"></div>
    </div>

    <!-- Contrôles flottants à droite -->
    <div class="absolute top-24 right-4 md:top-4 md:right-6 ui-overlay flex flex-col gap-3">
        <!-- Bouton 3D Cinématique -->
        <button onclick="toggleMode3D()" id="btn-3d" class="interactive glass hover:bg-blue-600 hover:text-white text-slate-800 dark:text-slate-200 p-3.5 rounded-2xl shadow-xl border border-white/20 dark:border-slate-700 font-black text-xs flex items-center justify-center w-13 h-13 transition-all cursor-pointer group" title="Activer la 3D">
            3D
        </button>
        <!-- Bouton Géolocalisation -->
        <button onclick="locateUser()" class="interactive glass hover:bg-blue-600 hover:text-white text-blue-600 dark:text-blue-400 p-3.5 rounded-2xl shadow-xl border border-white/20 dark:border-slate-700 flex items-center justify-center w-13 h-13 cursor-pointer transition-all" title="Ma position">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
        <!-- Bouton Paramètres / Styles -->
        <button onclick="toggleMapDetails()" class="interactive glass hover:bg-blue-600 hover:text-white text-slate-800 dark:text-slate-200 p-3.5 rounded-2xl shadow-xl border border-white/20 dark:border-slate-700 flex items-center justify-center w-13 h-13 cursor-pointer transition-all" title="Styles de carte">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16m-7 6h7"/></svg>
        </button>
    </div>

    <!-- Fenêtre modale Styles & Modes de carte -->
    <div id="map-details-modal" class="absolute top-24 right-24 w-80 glass shadow-2xl rounded-3xl z-30 hidden border border-white/20 dark:border-slate-700 p-6 flex flex-col gap-5 ui-overlay interactive backdrop-blur-2xl">
        <div class="flex justify-between items-center border-b border-slate-300 dark:border-slate-700 pb-3">
            <h3 class="font-extrabold text-slate-900 dark:text-white text-sm">Styles & Ambiance</h3>
            <button onclick="toggleMapDetails()" class="text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-bold text-lg cursor-pointer">&times;</button>
        </div>

        <div>
            <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2.5">Type de vue</div>
            <div class="grid grid-cols-2 gap-2.5">
                <button onclick="setMapStyle('default')" id="style-default-btn" class="p-3.5 border-2 border-blue-500 rounded-2xl flex flex-col items-center gap-1.5 bg-blue-500/10 text-blue-600 dark:text-blue-400 font-extrabold text-xs cursor-pointer transition-all">🗺️ Standard</button>
                <button onclick="setMapStyle('satellite')" id="style-satellite-btn" class="p-3.5 border-2 border-slate-300 dark:border-slate-700 rounded-2xl flex flex-col items-center gap-1.5 bg-slate-200/50 dark:bg-slate-800/50 text-slate-700 dark:text-slate-300 font-medium text-xs hover:border-slate-500 cursor-pointer transition-all">🛰️ Satellite</button>
            </div>
        </div>

        <div>
            <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2.5">Atmosphère</div>
            <div class="grid grid-cols-2 gap-2.5">
                <button onclick="setTheme('light')" id="theme-light-btn" class="p-3 border-2 border-blue-500 rounded-2xl flex items-center justify-center gap-2 font-bold text-xs bg-blue-500/10 text-blue-600 dark:text-blue-400 cursor-pointer transition">☀️ Jour</button>
                <button onclick="setTheme('dark')" id="theme-dark-btn" class="p-3 border border-slate-300 dark:border-slate-700 rounded-2xl flex items-center justify-center gap-2 font-bold text-xs bg-slate-200/50 dark:bg-slate-800/50 text-slate-700 dark:text-slate-300 cursor-pointer hover:bg-slate-300 dark:hover:bg-slate-700 transition">🌙 Cyber Nuit</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast Stylé -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 glass text-slate-900 dark:text-white px-6 py-3 rounded-2xl shadow-2xl z-50 text-xs font-bold border border-white/20 dark:border-slate-700 hidden transition-all duration-300 flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-ping"></span>
        <span id="toast-text">Action effectuée</span>
    </div>

    <!-- Carte -->
    <div id="map"></div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [10, 20],
            zoom: 2,
            pitch: 0,
            bearing: 0
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        function setupCustom3DBuildings() {
            const style = map.getStyle();
            if (!style || !style.layers) return;

            // Supprime proprement tous les calques de bâtiments natifs du fond de carte pour éviter les doublons noirs
            style.layers.forEach(layer => {
                if (layer.id.includes('building') && layer.type === 'fill') {
                    try { map.removeLayer(layer.id); } catch(e) {}
                }
            });

            // Ajoute notre propre couche 3D propre et lumineuse
            if (!map.getLayer('custom-3d-buildings')) {
                // Trouve la source des bâtiments du style liberty
                const buildingLayer = style.layers.find(l => l.source && (l.id.includes('building') || l['source-layer'] === 'building'));
                if (buildingLayer) {
                    map.addLayer({
                        'id': 'custom-3d-buildings',
                        'source': buildingLayer.source,
                        'source-layer': buildingLayer['source-layer'] || 'building',
                        'type': 'fill-extrusion',
                        'minzoom': 13,
                        'paint': {
                            'fill-extrusion-color': [
                                'interpolate',
                                ['linear'],
                                ['get', 'height'],
                                0, '#e2e8f0',
                                50, '#cbd5e1',
                                150, '#94a3b8'
                            ],
                            'fill-extrusion-height': ['get', 'height'],
                            'fill-extrusion-base': ['get', 'min_height'],
                            'fill-extrusion-opacity': 0.9
                        }
                    });
                }
            }
            const isDark = document.documentElement.classList.contains('dark');
            map.setLayoutProperty('custom-3d-buildings', 'visibility', (is3D && !isSatellite) ? 'visible' : 'none');
        }

        map.on('style.load', function () {
            setupCustom3DBuildings();
        });

        let is3D = false;
        function toggleMode3D() {
            const btn = document.getElementById('btn-3d');
            is3D = !is3D;
            if (is3D) {
                map.easeTo({ pitch: 70, bearing: -45, duration: 1800, easing: (t) => t * (2 - t) });
                if (map.getLayer('custom-3d-buildings')) {
                    map.setLayoutProperty('custom-3d-buildings', 'visibility', isSatellite ? 'none' : 'visible');
                } else {
                    setupCustom3DBuildings();
                }
                btn.className = "interactive bg-blue-600 text-white p-3.5 rounded-2xl shadow-xl shadow-blue-500/50 font-black text-xs flex items-center justify-center w-13 h-13 transition-all cursor-pointer";
                showToast("🏙️ Mode 3D Ultra-Détaillé Activé");
            } else {
                map.easeTo({ pitch: 0, bearing: 0, duration: 1500 });
                if (map.getLayer('custom-3d-buildings')) {
                    map.setLayoutProperty('custom-3d-buildings', 'visibility', 'none');
                }
                btn.className = "interactive glass hover:bg-blue-600 hover:text-white text-slate-800 dark:text-slate-200 p-3.5 rounded-2xl shadow-xl border border-white/20 dark:border-slate-700 font-black text-xs flex items-center justify-center w-13 h-13 transition-all cursor-pointer";
                showToast("Vue standard rétablie");
            }
        }

        function toggleMapDetails() {
            const modal = document.getElementById('map-details-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function setTheme(theme) {
            const lightBtn = document.getElementById('theme-light-btn');
            const darkBtn = document.getElementById('theme-dark-btn');
            if (theme === 'light') {
                document.documentElement.classList.remove('dark');
                if(!isSatellite) map.setStyle('https://tiles.openfreemap.org/styles/liberty');
                lightBtn.className = "p-3 border-2 border-blue-500 rounded-2xl flex items-center justify-center gap-2 font-bold text-xs bg-blue-500/10 text-blue-600 dark:text-blue-400 cursor-pointer transition";
                darkBtn.className = "p-3 border border-slate-300 dark:border-slate-700 rounded-2xl flex items-center justify-center gap-2 font-bold text-xs bg-slate-200/50 dark:bg-slate-800/50 text-slate-700 dark:text-slate-300 cursor-pointer hover:bg-slate-300 dark:hover:bg-slate-700 transition";
                showToast("☀️ Ambiance Jour activée");
            } else {
                document.documentElement.classList.add('dark');
                if(!isSatellite) map.setStyle('https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json');
                darkBtn.className = "p-3 border-2 border-blue-500 rounded-2xl flex items-center justify-center gap-2 font-bold text-xs bg-blue-500/10 text-blue-600 dark:text-blue-400 cursor-pointer transition";
                lightBtn.className = "p-3 border border-slate-300 dark:border-slate-700 rounded-2xl flex items-center justify-center gap-2 font-bold text-xs bg-slate-200/50 dark:bg-slate-800/50 text-slate-700 dark:text-slate-300 cursor-pointer hover:bg-slate-300 dark:hover:bg-slate-700 transition";
                showToast("🌙 Cyber Nuit activée");
            }
        }

        let isSatellite = false;
        function setMapStyle(styleType) {
            const defaultBtn = document.getElementById('style-default-btn');
            const satBtn = document.getElementById('style-satellite-btn');
            isSatellite = (styleType === 'satellite');
            if (isSatellite) {
                map.setStyle({
                    version: 8,
                    sources: {
                        'satellite-source': {
                            type: 'raster',
                            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                            tileSize: 256
                        }
                    },
                    layers: [{ id: 'satellite-layer', type: 'raster', source: 'satellite-source', minzoom: 0, maxzoom: 22 }]
                });
                satBtn.className = "p-3.5 border-2 border-blue-500 rounded-2xl flex flex-col items-center gap-1.5 bg-blue-500/10 text-blue-600 dark:text-blue-400 font-extrabold text-xs cursor-pointer transition-all";
                defaultBtn.className = "p-3.5 border-2 border-slate-300 dark:border-slate-700 rounded-2xl flex flex-col items-center gap-1.5 bg-slate-200/50 dark:bg-slate-800/50 text-slate-700 dark:text-slate-300 font-medium text-xs hover:border-slate-500 cursor-pointer transition-all";
                showToast("🛰️ Vue Satellite HD activée");
            } else {
                const isDark = document.documentElement.classList.contains('dark');
                map.setStyle(isDark ? 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json' : 'https://tiles.openfreemap.org/styles/liberty');
                defaultBtn.className = "p-3.5 border-2 border-blue-500 rounded-2xl flex flex-col items-center gap-1.5 bg-blue-500/10 text-blue-600 dark:text-blue-400 font-extrabold text-xs cursor-pointer transition-all";
                satBtn.className = "p-3.5 border-2 border-slate-300 dark:border-slate-700 rounded-2xl flex flex-col items-center gap-1.5 bg-slate-200/50 dark:bg-slate-800/50 text-slate-700 dark:text-slate-300 font-medium text-xs hover:border-slate-500 cursor-pointer transition-all";
                showToast("🗺️ Vue Standard activée");
            }
        }

        const landmarksAndCities = [
            { name: "Paris, France", coords: [2.3522, 48.8566], zoom: 16 },
            { name: "Londres, Royaume-Uni", coords: [-0.1278, 51.5074], zoom: 16 },
            { name: "New York, USA", coords: [-74.0060, 40.7128], zoom: 16 },
            { name: "Tokyo, Japon", coords: [139.6917, 35.6895], zoom: 16 },
            { name: "Singapour, Singapour", coords: [103.8198, 1.3521], zoom: 16 },
            { name: "Hong Kong", coords: [114.1694, 22.3193], zoom: 16 },
            { name: "Dubaï, Émirats arabes unis", coords: [55.2708, 25.2048], zoom: 16 },
            { name: "🗼 Tour Eiffel, Paris", coords: [2.2945, 48.8584], zoom: 17 },
            { name: "🗽 Statue de la Liberté, New York", coords: [-74.0445, 40.6892], zoom: 17 },
            { name: "🇬🇧 Big Ben, Londres", coords: [-0.1246, 51.5007], zoom: 17 },
            { name: "🏛️ Colisée, Rome", coords: [12.4922, 41.8902], zoom: 17 },
            { name: "🏗️ Burj Khalifa, Dubaï", coords: [55.2744, 25.1972], zoom: 17 },
            { name: "🗼 Tokyo Tower, Japon", coords: [139.7454, 35.6586], zoom: 17 },
            { name: "⛩️ Temple Senso-ji, Tokyo", coords: [139.7967, 35.7148], zoom: 17 },
            { name: "🏰 Arc de Triomphe, Paris", coords: [2.2950, 48.8738], zoom: 17 }
        ];

        function handleSearchInput(val) {
            const box = document.getElementById('suggestions-box');
            if (!val || val.length < 1) { box.style.display = 'none'; return; }
            const query = val.toLowerCase();
            const matches = landmarksAndCities.filter(c => c.name.toLowerCase().includes(query));

            if (matches.length > 0) {
                box.innerHTML = '';
                matches.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'p-3 hover:bg-blue-500/20 cursor-pointer text-xs font-bold text-slate-900 dark:text-slate-200 border-b border-slate-200 dark:border-white/10 transition';
                    div.innerText = m.name;
                    div.onclick = () => {
                        document.getElementById('search-input').value = m.name;
                        box.style.display = 'none';
                        map.flyTo({ center: m.coords, zoom: m.zoom, pitch: 65, bearing: -30, duration: 2500 });
                        if (!is3D) toggleMode3D();
                        placeMarker(m.coords, m.name);
                    };
                    box.appendChild(div);
                });
                box.style.display = 'block';
            } else { box.style.display = 'none'; }
        }

        let currentMarker = null;
        function placeMarker(coords, title) {
            if (currentMarker) currentMarker.remove();
            
            const el = document.createElement('div');
            el.className = 'relative flex items-center justify-center w-8 h-8';
            el.innerHTML = `
                <div class="absolute w-8 h-8 rounded-full bg-blue-500/40 marker-pulse"></div>
                <div class="w-4 h-4 rounded-full bg-blue-600 border-2 border-white shadow-lg"></div>
            `;

            currentMarker = new maplibregl.Marker({ element: el })
                .setLngLat(coords)
                .setPopup(new maplibregl.Popup({ offset: 15 }).setHTML(`<div style="color:#0f172a; font-weight:bold; padding:4px;">📍 ${title}</div>`))
                .addTo(map);
            currentMarker.togglePopup();
        }

        async function searchLocation() {
            const query = document.getElementById('search-input').value;
            if (!query) return;
            document.getElementById('suggestions-box').style.display = 'none';

            const found = landmarksAndCities.find(item => item.name.toLowerCase().includes(query.toLowerCase()));
            if (found) {
                map.flyTo({ center: found.coords, zoom: found.zoom, pitch: 65, bearing: -30, duration: 2500 });
                if (!is3D) toggleMode3D();
                placeMarker(found.coords, found.name);
                showToast(`📍 Destination : ${found.name}`);
                return;
            }

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.flyTo({ center: [lon, lat], zoom: 16, pitch: 65, bearing: -30, duration: 2500 });
                    if (!is3D) toggleMode3D();
                    placeMarker([lon, lat], data[0].display_name.split(',')[0]);
                    showToast(`📍 Destination : ${data[0].display_name.split(',')[0]}`);
                }
            } catch (e) { showToast("Lieu introuvable"); }
        }

        document.getElementById('search-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') searchLocation(); });

        const placeNames = {
            restaurants: ["Le Grand Restaurant Étoilé", "Le Bistro Parisien", "The Golden Fork", "Sushi Master Tokyo", "L'Auberge Gourmande"],
            hotels: ["Hôtel Royal Palace", "Grand Luxury Hotel & Spa", "The Skyline Oasis", "Continental Plaza"],
            attractions: ["Musée d'Art Contemporain", "Parc Central & Fontaine", "Belvédère Panoramique", "Grand Monument Historique"],
            gas: ["Station TotalEnergies 24/24", "Shell Express VIP", "BP PowerStation"]
        };

        function openCategoryList(category) {
            const sidebar = document.getElementById('sidebar-list');
            const title = document.getElementById('sidebar-title');
            const itemsContainer = document.getElementById('sidebar-items');
            sidebar.style.display = 'flex';
            itemsContainer.innerHTML = '';
            
            title.innerText = `EXPLORATION : ${category.toUpperCase()}`;
            const namesList = placeNames[category] || ["Lieu Pro"];

            for (let i = 1; i <= 30; i++) {
                const randomName = namesList[(i - 1) % namesList.length] + ` #${i}`;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'p-3.5 glass hover:bg-blue-500/10 rounded-2xl cursor-pointer border border-slate-300 dark:border-white/10 transition-all duration-300 hover:scale-[1.02] shadow-sm';
                itemDiv.innerHTML = `
                    <div class="font-black text-xs text-slate-900 dark:text-white flex justify-between items-center">
                        <span>${randomName}</span>
                        <span class="text-[10px] bg-blue-500/20 text-blue-600 dark:text-blue-400 px-2.5 py-0.5 rounded-full font-extrabold">⭐ 4.${i % 5}</span>
                    </div>
                    <div class="text-[11px] text-slate-600 dark:text-slate-400 mt-1.5 flex items-center gap-1 font-semibold">📍 Ouvert • À proximité</div>
                `;
                itemDiv.onclick = () => {
                    const center = map.getCenter();
                    const randomLat = center.lat + (Math.random() - 0.5) * 0.015;
                    const randomLon = center.lng + (Math.random() - 0.5) * 0.015;
                    map.flyTo({ center: [randomLon, randomLat], zoom: 17, pitch: 70, duration: 1500 });
                    placeMarker([randomLon, randomLat], randomName);
                    showToast(`Sélection : ${randomName}`);
                };
                itemsContainer.appendChild(itemDiv);
            }
            showToast(`Chargement de ${category} réussi !`);
        }

        function closeSidebar() { document.getElementById('sidebar-list').style.display = 'none'; }

        function locateUser() {
            if (!navigator.geolocation) return showToast("Géolocalisation non supportée.");
            showToast("🛰️ Recherche de votre position GPS...");
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude: lat, longitude: lon } = pos.coords;
                map.flyTo({ center: [lon, lat], zoom: 17, pitch: 70 });
                placeMarker([lon, lat], "Vous êtes ici");
                showToast("🎯 Position trouvée avec succès !");
            });
        }

        let toastTimer;
        function showToast(text) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            if(!toast) return;
            toastText.innerText = text;
            toast.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.add('hidden'), 3500);
        }
    </script>
</body>
</html>
